<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TUI Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px;
            background: #f3f4f6;
            font-family: system-ui, sans-serif;
        }

        .terminal {
            max-width: 1000px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #343741;
            border-radius: 12px;
            background: #17191f;

            box-shadow:
                0 0 12px 12px rgba(20, 25, 35, 0.20),
                0 5px 5px rgba(20, 25, 35, 0.12);
        }

        .titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 16px;
            border-bottom: 1px solid #343741;
            color: #b7bbc5;
            font-size: 13px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .red {
            background: #ff5f57;
        }

        .yellow {
            background: #febc2e;
        }

        .green {
            background: #28c840;
        }

        .title {
            flex: 1;
            text-align: center;
            padding-right: 49px;
        }

        /* .preview {
            padding: 12px;
            background: #17191f;
        } */

        .preview img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="terminal">
        <div class="titlebar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">nrun — Terminal</span>
        </div>

        <div class="preview">
            <img src="tui-demo-padded.png" alt="Application TUI">
        </div>
    </div>
</body>

</html>
