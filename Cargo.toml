[package]
name = "nrun"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
glob = "0.3.4"
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
owo-colors = "4.4.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tui-input = "0.15.5"

# For integration tests
[dev-dependencies]
tempfile = "3"
fs_extra = "1"

[lints.clippy]
needless_return = "allow"
collapsible_if = "allow"
enum_variant_names = "allow"
let_and_return = "allow"
unused_unit = "allow"
redundant_field_names = "allow"
question_mark = "allow"
unnecessary_unwrap = "allow"
