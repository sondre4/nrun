name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches:
      - dev/ci

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Check formatting and linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check linting
        run: cargo clippy --all-targets --all-features -- -D warnings

  check-and-test:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      # Setup Node package managers for integration tests
      # Setup Node/npm
      - name: Setup Node/npm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node installed
        run: |
          node --version


      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"


      # Setup Yarn by enabling corepack
      - name: Setup Yarn (corepack)
        run: corepack enable


      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"


      # Check if the package managers are installed
      - name: Check package manager versions
        run: |
          npm --version
          pnpm --version
          yarn --version
          bun --version


        # Cargo check and test (unit and integration tests)
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run cargo check
        run: cargo check --all-features

      - name: Run unit tests and integration tests
        run: cargo test --workspace --all-features
